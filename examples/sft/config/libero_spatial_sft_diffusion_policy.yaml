# Diffusion policy SFT on the LIBERO-Spatial episodes of physical-intelligence/libero.
#
# Launch: bash examples/sft/run_vla_sft.sh libero_spatial_sft_diffusion_policy
# Data:   hf download physical-intelligence/libero --repo-type dataset --local-dir /path/to/libero
# Evaluate <log_path>/checkpoints/global_step_<N>/actor/model_state_dict/full_weights.pt
# with evaluations/libero/libero_spatial_diffusion_policy_eval.yaml.

defaults:
  - model/diffusion_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/
    - file://${oc.env:REPO_PATH}/examples/embodiment/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf-diffusion-policy
    experiment_name: "libero_spatial_sft_diffusion_policy"
    logger_backends: ["wandb", "tensorboard"]

  max_epochs: -1
  max_steps: 200000
  val_check_interval: -1
  save_interval: 20000

data:
  train_data_paths: "/home/barryyeh/datasets/libero" # https://huggingface.co/datasets/physical-intelligence/libero
  task_suite_name: libero_spatial
  image_key: "image"
  action_key: "actions"
  # Decoded main-camera frames (about 10 GB for LIBERO-Spatial at 256x256).
  cache_dir: "/home/barryyeh/datasets/cache/diffusion_policy"
  num_workers: 8

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 64
  seed: 1000

  optim:
    lr: 1.0e-4
    adam_beta1: 0.95
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 1.0e-6
    clip_grad: 10.0
    warmup_style: "cosine"
    lr_warmup_steps: 500
    total_training_steps: null

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
