# Language-conditioned diffusion transformer (LeRobot MultiTaskDiTPolicy: CLIP ViT-B/16
# frames + frozen CLIP text, AdaLN-Zero DiT, DDPM). Inputs are main-camera frames and the
# instruction only, matching what the OpenSora world model provides.

model_type: "multitask_dit"
model_path: ""
precision: "fp32"
is_lora: False
lora_rank: 32

# LIBERO: 6-DoF delta end-effector + gripper; per-dimension min/max of the
# LIBERO-Spatial demos in physical-intelligence/libero.
action_dim: 7
action_min: [-0.9375, -0.9375, -0.9375, -0.1875, -0.3675, -0.36, -1.0]
action_max: [0.9375, 0.9375, 0.9375, 0.1971, 0.3364, 0.375, 1.0]

# Actions executed per inference; also the env-step spacing of the frame history.
# The OpenSora world model generates 8 frames per call, so this stays 8.
num_action_chunks: 8
horizon: 32
n_obs_steps: 2

resize_shape: null
crop_shape: [224, 224]
vision_encoder_name: "openai/clip-vit-base-patch16"
text_encoder_name: "openai/clip-vit-base-patch16"
vision_encoder_lr_multiplier: 0.1

hidden_dim: 768
num_layers: 8
num_heads: 12
dropout: 0.1
timestep_embed_dim: 256
rope_base: 10000.0

num_train_timesteps: 100
num_inference_steps: 100
clip_sample_range: 1.0
