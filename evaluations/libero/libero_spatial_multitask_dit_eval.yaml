defaults:
  - env/libero_spatial@env.eval
  - model/multitask_dit@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf-multitask-dit
    experiment_name: "libero_spatial_multitask_dit_eval"
    logger_backends: ["wandb", "tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  # SFT output: <log_path>/<experiment_name>/checkpoints/global_step_<N>/actor/model_state_dict/full_weights.pt
  ckpt_path: /path/to/full_weights.pt

env:
  group_name: "EnvGroup"

  eval:
    # 50 envs x 10 epochs covers all 500 LIBERO-Spatial initial states.
    rollout_epoch: 10
    total_num_envs: 50
    auto_reset: True
    # The policy's frame history assumes every episode runs to max_episode_steps.
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
